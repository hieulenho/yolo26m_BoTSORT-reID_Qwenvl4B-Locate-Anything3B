tracker:
  name: tracktrack_open_realtime
  tracker_type: tracktrack
  # YOLOE text-prompt detections are typically lower-confidence than closed-set
  # YOLO. These thresholds were selected by the recorded t010/t015/t020 ablation.
  track_high_thresh: 0.10
  track_low_thresh: 0.03
  new_track_thresh: 0.12
  track_buffer: 60
  match_thresh: 0.75
  lost_match_thr: 0.85
  iou_weight: 0.65
  reid_weight: 0.35
  conf_weight: 0.10
  angle_weight: 0.05
  penalty_p: 0.20
  penalty_q: 0.40
  reduce_step: 0.05
  tai_thr: 0.50
  min_track_len: 2
  gmc_method: sparseOptFlow
  with_reid: false
  model: auto
  class_aware: false
  class_gate: false

output:
  confirmed_only: true
  require_recent_update: true
  max_time_since_update_for_output: 0
  min_hits_for_output: 2
  compact_ids: true

runtime:
  log_level: INFO
