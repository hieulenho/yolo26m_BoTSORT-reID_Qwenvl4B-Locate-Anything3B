schema_version: "1.0"

task:
  id: microscopy_cells
  name: Microscopy cell tracking
  description: >-
    Track cells using the task-specific detector and describe only visible
    morphology; no diagnosis is produced.

detector:
  name: yolo26s_ctc_seq01_adapter
  backend: ultralytics
  checkpoint: models/detector/microscopy/yolo26s_ctc_gowt1_seq01_best.pt
  class_ids: [0]
  tracker_class_ids: [0]
  preserve_source_classes: false
  target_class_id: 0
  target_class_name: cell
  imgsz: 640
  conf: 0.10
  iou: 0.60
  max_det: 500
  half: true
  preprocessing:
    mode: auto_low_light
    clahe_clip_limit: 1.5
    clahe_grid_size: 8
    low_light_threshold: 60

tracker:
  name: tracktrack
  config: configs/trackers/tracktrack_realtime.yaml
  stabilize_classes: true
  class_history_frames: 20
  class_switch_margin: 0.20

semantic:
  enabled: true
  provider: qwen
  model_id: Qwen/Qwen3-VL-4B-Instruct
  quantization: 8bit
  label_mode: closed
  allowed_labels: [cell, dividing_cell, uncertain_cell, unknown]
  attributes: [shape, relative_size, visible_division_state]
  instruction: >-
    Describe only visible morphology across supplied frames. Use dividing_cell
    only when a division pattern is visible repeatedly. Never infer disease,
    pathology, or treatment; return unknown when uncertain.
  unknown_threshold: 0.85
  event_interval_frames: 12
  events_per_frame: 3
  max_pending_events: 256
  max_evidence_images: 2
  evidence_layout: panel
  evidence_panel_width: 512
  evidence_panel_height: 384
  minimum_crop_quality: 0.15
  replacement_quality_margin: 0.05

render:
  show_confidence: true
  show_trajectory: true
  trajectory_length: 12
  line_thickness: 2
  font_scale: 0.50
