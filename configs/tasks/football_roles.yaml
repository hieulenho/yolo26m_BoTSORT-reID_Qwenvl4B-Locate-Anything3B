schema_version: "1.0"

task:
  id: football_roles
  name: Football player and official tracking
  description: >-
    Track people on a football pitch and assign only visually supported team or
    match-role labels.

detector:
  name: yolo26m_football_finetuned
  backend: ultralytics
  checkpoint: models/detector/football/yolo26m_best.pt
  class_ids: [0]
  tracker_class_ids: [0]
  preserve_source_classes: false
  target_class_id: 0
  target_class_name: person
  imgsz: 960
  conf: 0.10
  iou: 0.70
  max_det: 300
  half: true
  preprocessing:
    mode: none
    clahe_clip_limit: 2.0
    clahe_grid_size: 8
    low_light_threshold: 65

tracker:
  name: tracktrack
  config: configs/trackers/tracktrack_realtime.yaml
  stabilize_classes: true
  class_history_frames: 45
  class_switch_margin: 0.20

semantic:
  enabled: true
  provider: qwen
  model_id: Qwen/Qwen3-VL-4B-Instruct
  quantization: 8bit
  label_mode: closed
  allowed_labels: [team_a_player, team_b_player, goalkeeper, referee, staff, unknown]
  attributes: [kit_color, visible_number, activity]
  instruction: >-
    Use kit consistency across repeated crops to assign team_a_player or
    team_b_player. Use goalkeeper or referee only when clothing and field context
    jointly support the role. Do not infer a named player or field position.
  unknown_threshold: 0.78
  event_interval_frames: 45
  events_per_frame: 2
  max_pending_events: 128
  max_evidence_images: 2
  evidence_layout: panel
  evidence_panel_width: 512
  evidence_panel_height: 384
  minimum_crop_quality: 0.20
  replacement_quality_margin: 0.06

render:
  show_confidence: true
  show_trajectory: true
  trajectory_length: 30
  line_thickness: 2
  font_scale: 0.55
