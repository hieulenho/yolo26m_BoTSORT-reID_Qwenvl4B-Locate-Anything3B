schema_version: "1.0"

task:
  id: open_vocabulary_example
  name: Explicit open-vocabulary tracking example
  description: >-
    Example task for classes not covered by the selected closed-set detector. Edit
    text_classes before running this configuration.

detector:
  name: yoloe26s_task_vocabulary
  backend: ultralytics_yoloe
  checkpoint: yoloe-26s-seg.pt
  text_classes: [bird, medical instrument, teaching aid]
  class_ids: null
  tracker_class_ids: null
  preserve_source_classes: true
  imgsz: 640
  conf: 0.10
  iou: 0.65
  max_det: 300
  half: false
  preprocessing:
    mode: none
    clahe_clip_limit: 2.0
    clahe_grid_size: 8
    low_light_threshold: 65

tracker:
  name: tracktrack
  config: configs/trackers/tracktrack_open_realtime.yaml
  stabilize_classes: true
  class_history_frames: 30
  class_switch_margin: 0.25

semantic:
  enabled: true
  provider: qwen
  model_id: Qwen/Qwen3-VL-4B-Instruct
  quantization: 8bit
  label_mode: open
  attributes: [subtype, species, material, activity]
  instruction: >-
    Refine each tracked open-vocabulary object using only repeated visible evidence.
    Return unknown when a fine label is not visually distinguishable.
  unknown_threshold: 0.75
  event_interval_frames: 45
  events_per_frame: 2
  max_pending_events: 128
  max_evidence_images: 2
  evidence_layout: panel
  evidence_panel_width: 512
  evidence_panel_height: 384
  minimum_crop_quality: 0.25
  replacement_quality_margin: 0.08

render:
  show_confidence: true
  show_trajectory: true
  trajectory_length: 20
  line_thickness: 2
  font_scale: 0.55
