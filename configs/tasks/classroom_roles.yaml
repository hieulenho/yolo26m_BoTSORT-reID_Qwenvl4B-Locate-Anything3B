schema_version: "1.0"

task:
  id: classroom_roles
  name: Classroom role tracking
  description: >-
    Track people in a classroom and classify a stable visible role while rejecting
    uncertain role assignments.

detector:
  name: yolo26n_coco_person
  backend: ultralytics
  checkpoint: yolo26n.pt
  class_ids: [0, 1000, 1001, 1002, 1003]
  tracker_class_ids: [0]
  supplemental_detectors:
    - name: yoloe26s_classroom_role_proposals
      backend: ultralytics_yoloe
      checkpoint: yoloe-26s-seg.pt
      text_classes: [student, teacher, classroom staff, visitor]
      input_class_ids: [0, 1, 2, 3]
      output_class_ids: [1000, 1001, 1002, 1003]
      class_names: [student, teacher, classroom_staff, visitor]
      every_n_frames: 6
      half: false
  preserve_source_classes: true
  imgsz: 640
  conf: 0.18
  iou: 0.65
  max_det: 200
  half: true
  preprocessing:
    mode: auto_low_light
    clahe_clip_limit: 2.0
    clahe_grid_size: 8
    low_light_threshold: 70

tracker:
  name: tracktrack
  config: configs/trackers/tracktrack_realtime.yaml
  stabilize_classes: true
  class_history_frames: 30
  class_switch_margin: 0.20

semantic:
  enabled: true
  provider: qwen
  model_id: Qwen/Qwen3-VL-4B-Instruct
  quantization: 8bit
  label_mode: closed
  allowed_labels: [student, teacher, classroom_staff, visitor, unknown]
  attributes: [activity, clothing, position_in_room]
  instruction: >-
    Assign a classroom role from repeated visible evidence. Use teacher only when
    teaching behavior or a consistent instructor position is visible; otherwise use
    student, visitor, classroom_staff, or unknown. Clothing alone is insufficient.
  unknown_threshold: 0.78
  event_interval_frames: 30
  events_per_frame: 3
  max_pending_events: 128
  max_evidence_images: 2
  evidence_layout: panel
  evidence_panel_width: 512
  evidence_panel_height: 384
  minimum_crop_quality: 0.22
  replacement_quality_margin: 0.06

render:
  show_confidence: true
  show_trajectory: false
  trajectory_length: 15
  line_thickness: 2
  font_scale: 0.55
