schema_version: "1.0"

task:
  id: generic_coco_realtime
  name: Generic COCO object tracking
  description: >-
    Track all COCO objects and assign an open hierarchical subtype only when the
    visual evidence supports it.

detector:
  name: yolo26n_coco
  backend: ultralytics
  checkpoint: yolo26n.pt
  class_ids: null
  tracker_class_ids: null
  preserve_source_classes: true
  target_class_id: 0
  target_class_name: object
  imgsz: 640
  conf: 0.20
  iou: 0.65
  max_det: 300
  half: true
  preprocessing:
    mode: auto_low_light
    clahe_clip_limit: 2.0
    clahe_grid_size: 8
    low_light_threshold: 65

tracker:
  name: tracktrack
  config: configs/trackers/tracktrack_multiclass_realtime.yaml
  stabilize_classes: true
  class_history_frames: 30
  class_switch_margin: 0.20

semantic:
  enabled: true
  provider: qwen
  model_id: Qwen/Qwen3-VL-4B-Instruct
  quantization: 8bit
  label_mode: open
  attributes: [color, subtype, activity, visible_markings]
  instruction: >-
    Refine the detector class into the most specific stable subtype, species,
    vehicle type, or object category supported by the crop. Do not infer identity,
    profession, role, brand, or species from scene context alone.
  unknown_threshold: 0.72
  event_interval_frames: 45
  events_per_frame: 2
  max_pending_events: 128
  max_evidence_images: 2
  evidence_layout: panel
  evidence_panel_width: 512
  evidence_panel_height: 384
  minimum_crop_quality: 0.25
  replacement_quality_margin: 0.08

render:
  show_confidence: true
  show_trajectory: true
  trajectory_length: 20
  line_thickness: 2
  font_scale: 0.55
