schema_version: "1.0"

task:
  id: traffic_objects
  name: Road-user tracking and vehicle subtype labeling
  description: >-
    Track visible road users and refine stable vehicle subtypes without inferring
    an unseen make, model, or license plate.

detector:
  name: yolo26n_coco_traffic
  backend: ultralytics
  checkpoint: yolo26n.pt
  class_ids: [0, 1, 2, 3, 5, 7]
  tracker_class_ids: [0, 1, 2, 3, 5, 7]
  preserve_source_classes: true
  target_class_id: 2
  target_class_name: vehicle
  imgsz: 640
  conf: 0.18
  iou: 0.65
  max_det: 300
  half: true
  preprocessing:
    mode: auto_low_light
    clahe_clip_limit: 2.0
    clahe_grid_size: 8
    low_light_threshold: 65

tracker:
  name: tracktrack
  config: configs/trackers/tracktrack_multiclass_realtime.yaml
  stabilize_classes: true
  class_history_frames: 30
  class_switch_margin: 0.20

semantic:
  enabled: true
  provider: qwen
  model_id: Qwen/Qwen3-VL-4B-Instruct
  quantization: 8bit
  label_mode: closed
  enable_fine_labels: true
  allowed_labels: [pedestrian, bicycle, motorcycle, car, van, bus, truck, unknown]
  attributes: [vehicle_type, color, motion_state, visible_markings]
  instruction: >-
    Refine each road-user track using repeated visible evidence. Prefer stable
    categories such as pedestrian, bicycle, motorcycle, car, van, bus, and truck.
    Return unknown when subtype evidence is weak; do not guess make or model.
  unknown_threshold: 0.75
  event_interval_frames: 90
  events_per_frame: 1
  max_pending_events: 12
  minimum_track_age_frames: 15
  max_evidence_images: 2
  evidence_layout: panel
  evidence_panel_width: 448
  evidence_panel_height: 336
  minimum_crop_quality: 0.22
  replacement_quality_margin: 0.07

render:
  show_confidence: true
  show_trajectory: true
  trajectory_length: 24
  line_thickness: 2
  font_scale: 0.55
